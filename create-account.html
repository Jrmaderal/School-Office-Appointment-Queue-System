<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — School Office Appointment Queue</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/register.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
  <div class="login-page">
    <div class="login-card wide">
      <div class="login-header">
        <h1>Create your account</h1>
        <p>Register as a student to use the queue system.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label>Account Type</label>
          <div class="role-selector">
            <button type="button" class="role-btn active" data-role="student" aria-pressed="true" disabled>
              <i data-lucide="graduation-cap" class="i-22"></i> Student
            </button>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Juan Dela Cruz" autocomplete="name" />
            <span class="field-error" id="regNameError"></span>
          </div>
          <div class="form-group">
            <label for="regId" id="regIdLabel">Student ID</label>
            <input type="text" id="regId" class="form-control" placeholder="e.g. STU-1045" autocomplete="off" />
            <span class="field-error" id="regIdError"></span>
          </div>
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="you@school.edu" autocomplete="email" />
            <span class="field-error" id="regEmailError"></span>
          </div>
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" autocomplete="username" />
            <span class="field-error" id="regUsernameError"></span>
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="regPassword" aria-label="Show password"><i data-lucide="eye" class="i-18"></i></button>
            </div>
            <span class="hint" id="passwordHint">At least 6 characters</span><span class="field-error" id="regPasswordError"></span>
          </div>
          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="regConfirm" class="form-control" placeholder="Re-enter password" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="regConfirm" aria-label="Show password"><i data-lucide="eye" class="i-18"></i></button>
            </div>
            <span class="field-error" id="regConfirmError"></span>
          </div>
        </div>

        <button type="submit" id="registerSubmit" class="btn btn-primary btn-block btn-lg">
          <i data-lucide="user-plus" class="i-18"></i>
          Create Account
        </button>
      </form>

      <div class="auth-links">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
