<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — School Office Appointment Queue</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>Welcome back</h1>
        <p>Sign in to the School Office Appointment Queue System to manage office queues.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert"></div>

      <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginUser">Username or Email</label>
            <input type="text" id="loginUser" class="form-control" placeholder="student or student@school.edu" autocomplete="username" />
            <span class="field-error" id="loginUserError"></span>
          </div>
          <div class="form-group">
            <label for="loginPass">Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPass" class="form-control" placeholder="Enter password" autocomplete="current-password" />
              <button type="button" class="toggle-password" data-target="loginPass" aria-label="Show password"><i data-lucide="eye" class="i-18"></i></button>
            </div>
            <span class="field-error" id="loginPassError"></span>
          </div>

        <div class="form-row">
          <label class="checkbox-label"><input type="checkbox" id="rememberMe" /> Remember me</label>
          <a href="reset-password.html" class="link">Forgot password?</a>
        </div>

        <button type="submit" id="loginSubmit" class="btn btn-primary btn-block btn-lg">
          <i data-lucide="log-in" class="i-18"></i>
          Sign In
        </button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="create-account.html">Create an account</a>
      </div>

      <div class="demo-box">
        <strong>Demo accounts</strong><br />
        Student: <strong>student</strong> / <strong>student123</strong><br />
        Staff: <strong>staff</strong> / <strong>staff123</strong>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
