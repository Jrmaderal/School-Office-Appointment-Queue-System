<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — School Office Appointment Queue</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/reset-password.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>Reset Your Password</h1>
        <p>Enter your registered username or email and we will help you set a new password.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert"></div>

      <div id="resetStep1">
        <form id="resetRequestForm" novalidate>
          <div class="form-group">
            <label for="resetIdentifier">Registered Email or Username</label>
            <input type="text" id="resetIdentifier" class="form-control" placeholder="student or student@school.edu" autocomplete="username" />
            <span class="field-error" id="resetIdentifierError"></span>
          </div>
          <p class="demo-note"><strong>Demonstration feature:</strong> no real email is sent. A reset code is generated and shown on screen.</p>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i data-lucide="mail" class="i-18"></i>
            Send Reset Code
          </button>
        </form>
      </div>

      <div id="resetStep2" class="hidden">
        <div class="reset-code-box" id="resetCodeBox">
          Your demo reset code
          <div class="code" id="resetCodeDisplay">000000</div>
          <small>Demonstration only — not sent by email.</small>
        </div>
        <form id="resetConfirmForm" novalidate>
          <div class="form-group">
            <label for="resetCode">Reset Code</label>
            <input type="text" id="resetCode" class="form-control" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
            <span class="field-error" id="resetCodeError"></span>
          </div>
          <div class="form-group">
            <label for="resetNewPass">New Password</label>
            <div class="password-wrapper">
              <input type="password" id="resetNewPass" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="resetNewPass" aria-label="Show password"><i data-lucide="eye" class="i-18"></i></button>
            </div>
            <span class="field-error" id="resetNewPassError"></span>
          </div>
          <div class="form-group">
            <label for="resetConfirmPass">Confirm New Password</label>
            <div class="password-wrapper">
              <input type="password" id="resetConfirmPass" class="form-control" placeholder="Re-enter new password" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="resetConfirmPass" aria-label="Show password"><i data-lucide="eye" class="i-18"></i></button>
            </div>
            <span class="field-error" id="resetConfirmPassError"></span>
          </div>
          <button type="submit" id="resetSubmit" class="btn btn-primary btn-block btn-lg">
            <i data-lucide="key" class="i-18"></i>
            Reset Password
          </button>
        </form>
        <div class="auth-links"><a href="#" id="backToResetStep1">← Request a new code</a></div>
      </div>

      <div class="auth-links">
        <a href="login.html"><i data-lucide="arrow-left" class="i-14"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
